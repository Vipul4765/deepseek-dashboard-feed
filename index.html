<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeepSeek Live Decisions</title>
<meta name="description" content="DeepSeek's own reasoning, trade by trade, on a live paper trading account.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#090b0a;
  --panel:#141917; --panel-hi:#1a2119; --panel-border:#262e29; --panel-border-hi:#38433c;
  --fg:#edf2ee; --fg-dim:#93a098; --fg-faint:#596059;
  --accent:#e8a33d; --accent-soft:#f0bc6c; --accent-dim:#4a3417;
  --profit:#4ade80; --profit-dim:#15301f;
  --loss:#f87171; --loss-dim:#3a1a1a;
  --live:#4ade80;
  --font-data:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(232,163,61,.07), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(74,222,128,.05), transparent 55%),
    var(--bg);
  color:var(--fg);font-family:var(--font-body);
  padding-inline:18px;padding-block:32px;max-width:780px;margin-inline:auto;
  font-variant-numeric:tabular-nums;
}
h1{text-wrap:balance;margin:0}

.header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  flex-wrap:wrap;padding-bottom:22px;margin-bottom:20px;border-bottom:1px solid var(--panel-border)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(155deg,var(--accent-soft),#a9690f);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-data);font-weight:700;
  color:#1a1206;font-size:17px;flex:none;box-shadow:0 4px 16px -4px rgba(232,163,61,.5)}
.brand-text h1{font-size:19px;font-weight:700;letter-spacing:.1px}
.brand-text .sub{font-size:11px;color:var(--fg-dim);font-family:var(--font-data);letter-spacing:.8px;margin-top:3px;text-transform:uppercase}
.disclosure{font-size:10.5px;color:var(--fg-faint);font-family:var(--font-data);letter-spacing:.3px;
  padding:6px 10px;border:1px solid var(--panel-border);border-radius:20px;background:var(--panel);white-space:nowrap}

.livebar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:13px 16px;margin-bottom:24px}
.livebar-left{display:flex;align-items:center;gap:10px}
.live-dot{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-data);font-size:11.5px;
  color:var(--live);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.live-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.live-dot.offline{color:var(--fg-faint)}
.live-dot.offline::before{background:var(--fg-faint);animation:none;box-shadow:none}
.updated-ago{font-family:var(--font-data);font-size:11.5px;color:var(--fg-dim)}
.updated-ago b{color:var(--fg);font-weight:600}
.refresh-track{width:64px;height:4px;border-radius:2px;background:var(--panel-border);overflow:hidden;flex:none}
.refresh-fill{height:100%;width:0%;background:var(--accent);transition:width 1s linear}

.feed{display:flex;flex-direction:column;gap:13px}
.feed-item{position:relative;background:var(--panel);border:1px solid var(--panel-border);
  border-radius:12px;padding:17px 19px 17px 22px;transition:border-color .2s}
.feed-item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--panel-border-hi)}
.feed-item.trade::before{background:linear-gradient(var(--accent-soft),var(--accent))}
.feed-item.stop::before{background:var(--loss)}
.feed-item:first-child{border-color:var(--panel-border-hi);background:var(--panel-hi)}
.feed-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.feed-time{font-family:var(--font-data);font-size:11.5px;color:var(--fg-faint);white-space:nowrap}
.feed-tag{font-family:var(--font-data);font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;
  font-weight:600;padding:3px 9px;border-radius:5px;background:var(--panel-border);color:var(--fg-dim)}
.feed-tag.trade{background:var(--accent-dim);color:var(--accent-soft)}
.feed-tag.stop{background:var(--loss-dim);color:var(--loss)}
.feed-text{font-size:15.5px;line-height:1.65;color:var(--fg);overflow-wrap:break-word;letter-spacing:.1px}
.feed-text b{color:var(--accent-soft);font-weight:600}
.empty{text-align:center;padding:48px 16px;color:var(--fg-faint);font-size:14px;
  border:1px dashed var(--panel-border);border-radius:12px}

footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--panel-border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:11px;color:var(--fg-faint);font-family:var(--font-data)}
footer a{color:var(--fg-dim);text-decoration:none;border-bottom:1px solid var(--panel-border)}
footer a:hover{color:var(--accent-soft);border-color:var(--accent-dim)}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-mark">DS</div>
    <div class="brand-text">
      <h1>DeepSeek Live Decisions</h1>
      <div class="sub">Why, in its own words</div>
    </div>
  </div>
  <span class="disclosure">paper account &middot; no real money</span>
</div>

<div class="livebar">
  <div class="livebar-left">
    <span class="live-dot" id="live-indicator">live</span>
    <span class="updated-ago" id="updated-ago">loading&hellip;</span>
  </div>
  <div class="refresh-track"><div class="refresh-fill" id="refresh-fill"></div></div>
</div>

<div class="feed" id="feed"><div class="empty">Loading the live feed&hellip;</div></div>

<footer>
  <span>Pushed straight from the trading server, no middle step</span>
  <a href="https://github.com/Vipul4765/deepseek-dashboard-feed">view source</a>
</footer>

<script>
var FEED_URL = "feed_raw.json";
var POLL_MS = 60000;
var lastFetchAt = null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
}); }

function timeLabel(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleTimeString("en-IN", {hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"}) + " IST";
}

function classify(summary){
  var s = (summary || "").toLowerCase();
  if(/\bstop\b|stopped out|forced exit|stop-loss hit|sl hit/.test(s)) return "stop";
  if(/\bopened\b|^opened|new entry:|entered |created strategy|started strategy/.test(s)) return "trade";
  return "note";
}

function highlightNumbers(text){
  return esc(text).replace(/(&#8377;?-?₹?-?\d[\d,]*(?:\.\d+)?)/g, '<b>$1</b>');
}

function render(data){
  var el = document.getElementById("feed");
  var items = (data.feed || []).slice().reverse();
  if(!items.length){ el.innerHTML = '<div class="empty">Waiting for the first update</div>'; return; }
  el.innerHTML = items.map(function(f, i){
    var cls = classify(f.summary);
    return '<div class="feed-item ' + cls + '">' +
      '<div class="feed-row"><span class="feed-time">' + esc(timeLabel(f.time)) + '</span>' +
      '<span class="feed-tag ' + cls + '">' + (i===0 ? "latest &middot; " + cls : cls).replace('&middot;','·') + '</span></div>' +
      '<div class="feed-text">' + esc(f.summary) + '</div></div>';
  }).join("");
}

function tickAgo(){
  var elAgo = document.getElementById("updated-ago");
  if(!lastFetchAt){ return; }
  var secs = Math.round((Date.now() - lastFetchAt) / 1000);
  var label = secs < 5 ? "just now" : secs < 60 ? secs + "s ago" : Math.round(secs/60) + "m ago";
  elAgo.innerHTML = "updated <b>" + label + "</b>";
  var pct = Math.min(100, (secs * 1000 / POLL_MS) * 100);
  document.getElementById("refresh-fill").style.width = pct + "%";
}

function load(){
  fetch(FEED_URL + "?t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      render(data);
      lastFetchAt = Date.now();
      var dot = document.getElementById("live-indicator");
      dot.textContent = "live";
      dot.className = "live-dot";
      document.getElementById("refresh-fill").style.width = "0%";
    })
    .catch(function(){
      var dot = document.getElementById("live-indicator");
      dot.textContent = "offline";
      dot.className = "live-dot offline";
    });
}

load();
setInterval(load, POLL_MS);
setInterval(tickAgo, 1000);
</script>
</body>
</html>
